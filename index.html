<!doctype html>
<html lang="en" data-theme="dark" data-accent="cyan">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b0e" />
    <script>
      try {
        var st = JSON.parse(localStorage.getItem('sysdash-settings') || '{}').state || {};
        var d = document.documentElement;
        if (st.theme === 'light' || st.theme === 'dark') d.dataset.theme = st.theme;
        if (['cyan', 'red', 'cobalt', 'sage'].indexOf(st.accentColor) > -1) d.dataset.accent = st.accentColor;
      } catch (e) {}
    </script>
    <title>SysDash - System Monitoring Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
